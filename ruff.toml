# Repo-wide Ruff config. Black does the formatting; Ruff does the linting.
# Line length matches Black's default (88).
line-length = 88
target-version = "py311"
extend-exclude = ["data", ".venv"]

[lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear, UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
# E501 (line too long) is left to Black.
ignore = ["E501"]

[lint.isort]
# Our own packages, so imports are grouped as first-party (Ruff can't infer this
# when run from the repo root).
known-first-party = ["colibrimo_pipeline"]
